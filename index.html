<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Link Analytics Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f8fafc; color: #1e293b; padding: 20px; margin: 0; }
    .wrapper { max-width: 1000px; margin: 0 auto; display: none; }
    .auth-panel { text-align: center; margin-top: 15%; }
    .auth-box { background: #fff; padding: 30px; display: inline-block; border: 1px solid #e2e8f0; border-radius: 8px; }
    .card { background: #fff; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; margin-top: 20px; }
    input, button { padding: 10px; font-family: inherit; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
    button { background: #2563eb; color: #fff; cursor: pointer; font-weight: 600; border: none; }
    button:hover { background: #1d4ed8; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
    th, td { padding: 8px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    th { background: #f1f5f9; }
  </style>
</head>
<body>
  <div class="auth-panel" id="auth-gate">
    <div class="auth-box">
      <h3>Dashboard Login</h3>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="pass" placeholder="Password">
      <button id="login-btn">Log In</button>
    </div>
  </div>

  <div class="wrapper" id="main-console">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2>Link Analytics</h2>
      <button id="logout-btn" style="width:auto; background:#ef4444;">Log Out</button>
    </div>

    <div class="card">
      <h3>Create Tracking Link</h3>
      <input type="text" id="link-label" placeholder="Label (e.g. Facebook Ad, Client Pitch)">
      <input type="text" id="target-url" placeholder="Destination URL (e.g. https://yourlisting.com)">
      <button id="generate-btn">Generate Link</button>
      <div id="output-link" style="margin-top:10px; word-break:break-all;"></div>
    </div>

    <div class="card">
      <h3>Click Logs <button id="refresh-btn" style="width:auto; float:right;">Refresh</button></h3>
      <table>
        <thead>
          <tr><th>Time</th><th>Link</th><th>Country</th><th>City</th><th>Device</th><th>Referrer</th></tr>
        </thead>
        <tbody id="rows"><tr><td colspan="6">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://YOUR-PROJECT-ID.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const REDIRECT_BASE_URL = "https://your-vercel-project.vercel.app/target.html";

    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) initConsole();
    });

    document.getElementById('login-btn').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('pass').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) alert("Login failed.");
      else initConsole();
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      location.reload();
    });

    function initConsole() {
      document.getElementById('auth-gate').style.display = "none";
      document.getElementById('main-console').style.display = "block";
      loadLogs();
    }

    document.getElementById('generate-btn').addEventListener('click', async () => {
      const label = document.getElementById('link-label').value;
      const destination = document.getElementById('target-url').value;
      if (!destination) return alert("Enter a destination URL.");
      const token = Math.random().toString(36).substring(2, 10);

      const { error } = await supabaseClient.from('tracking_links').insert([{ token, label, destination_url: destination }]);
      if (error) alert("Could not create link.");
      else {
        const link = `${REDIRECT_BASE_URL}?c=${token}`;
        document.getElementById('output-link').innerHTML = `<strong>Your link:</strong> ${link}`;
      }
    });

    async function loadLogs() {
      const tbody = document.getElementById('rows');
      const { data, error } = await supabaseClient
        .from('click_logs')
        .select('*, tracking_links(label)')
        .order('timestamp', { ascending: false });

      if (error || !data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6">No clicks yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = "";
      data.forEach(log => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${new Date(log.timestamp).toLocaleString()}</td>
          <td>${log.tracking_links?.label || log.associated_token}</td>
          <td>${log.country}</td>
          <td>${log.city}</td>
          <td>${log.device_type}</td>
          <td>${log.referrer}</td>
        `;
        tbody.appendChild(row);
      });
    }

    document.getElementById('refresh-btn').addEventListener('click', loadLogs);
  </script>
</body>
</html>
