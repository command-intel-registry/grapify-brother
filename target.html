<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <p style="font-family: sans-serif; text-align: center; margin-top: 20%; color:#555;">
    Redirecting... <br>
    <small>This link tracks clicks for analytics purposes.</small>
  </p>

  <script>
    const SUPABASE_URL = "https://YOUR-PROJECT-ID.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const params = new URLSearchParams(window.location.search);
    const linkToken = params.get('c');

    function getDeviceType() {
      const ua = navigator.userAgent;
      if (/tablet|ipad/i.test(ua)) return "Tablet";
      if (/mobile|android|iphone/i.test(ua)) return "Mobile";
      return "Desktop";
    }

    window.addEventListener('DOMContentLoaded', async () => {
      if (!linkToken) {
        document.body.innerHTML = "<p style='text-align:center;margin-top:20%;'>Invalid link.</p>";
        return;
      }

      const { data: linkData, error } = await supabaseClient
        .from('tracking_links')
        .select('destination_url')
        .eq('token', linkToken)
        .single();

      if (error || !linkData) {
        document.body.innerHTML = "<p style='text-align:center;margin-top:20%;'>Link not found.</p>";
        return;
      }

      // Get rough location from IP (city/country only, no exact tracking)
      let country = "Unknown", city = "Unknown";
      try {
        const geoRes = await fetch('https://ipapi.co/json/');
        const geoData = await geoRes.json();
        country = geoData.country_name || "Unknown";
        city = geoData.city || "Unknown";
      } catch (e) {}

      const logEntry = {
        associated_token: linkToken,
        country: country,
        city: city,
        device_type: getDeviceType(),
        referrer: document.referrer || "Direct"
      };

      try {
        await supabaseClient.from('click_logs').insert([logEntry]);
      } catch (e) {}

      window.location.replace(linkData.destination_url);
    });
  </script>
</body>
</html>
